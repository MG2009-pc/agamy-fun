o.root.position.set(z.x,Math.abs(s)*.08-(z.rise>0?z.rise*1.7:0),z.z);o.root.rotation.y=z.yaw;o.root.rotation.x=0;
o.lL.rotation.x=s*.6;o.lR.rotation.x=-s*.6*z.limp;o.body.rotation.x=.3+Math.sin(z.ph*.5)*.06;o.body.rotation.z=s*.09;
o.head.rotation.z=Math.sin(T*2.1+z.id)*.25;o.head.rotation.x=.15+Math.sin(T*3+z.id)*.1;
const th=z.atk>0?.5:0;o.aL.rotation.x=-1.3+Math.sin(z.ph+1)*.2-th;o.aR.rotation.x=-1.45+Math.sin(z.ph)*.2-th;o.aL.rotation.z=.12;o.aR.rotation.z=-.12}
function renderMinimap(){if(!mc.width||mc.width!==mc.clientWidth){mc.width=mc.clientWidth||120;mc.height=mc.clientHeight||180}
const mw=mc.width,mh=mc.height;mctx.fillStyle='#0d131f';mctx.fillRect(0,0,mw,mh);
const mapW=MAP.maxX-MAP.minX,mapH=MAP.maxZ-MAP.minZ;
const toX=x=>((x-MAP.minX)/mapW)*mw;
const toY=z=>((z-MAP.minZ)/mapH)*mh;
mctx.fillStyle='#1c2638';mctx.fillRect(toX(MAP.minX+1),toY(MAP.minZ+1),toX(MAP.maxX-1)-toX(MAP.minX+1),toY(MAP.maxZ-1)-toY(MAP.minZ+1));
mctx.fillStyle='#3a4861';
for(const obs of mapObstacles){const ox=toX(obs.x-obs.w/2),oy=toY(obs.z-obs.d/2),ow=(obs.w/mapW)*mw,od=(obs.d/mapH)*mh;mctx.fillRect(ox,oy,Math.max(2,ow),Math.max(2,od))}
mctx.fillStyle='#22c55e';
for(const k of S.pk){const kx=toX(k.x),ky=toY(k.z);mctx.beginPath();mctx.arc(kx,ky,3,0,Math.PI*2);mctx.fill()}
mctx.fillStyle='#ff3333';
for(const z of S.z){if(z.rise>0)continue;const zx=toX(z.x),zy=toY(z.z);mctx.beginPath();mctx.arc(zx,zy,3.5,0,Math.PI*2);mctx.fill()}
const px=toX(S.p.x),py=toY(S.p.z);
mctx.fillStyle='#2563eb';mctx.beginPath();mctx.arc(px,py,4.5,0,Math.PI*2);mctx.fill();
mctx.strokeStyle='#ffffff';mctx.lineWidth=1.5;mctx.stroke();
const dirLen=7;mctx.strokeStyle='#3b82f6';mctx.beginPath();mctx.moveTo(px,py);mctx.lineTo(px+Math.sin(S.p.aim)*dirLen,py+Math.cos(S.p.aim)*dirLen);mctx.stroke()}
function render(dt){const p=S.p,play=st=='play';
PL.root.position.set(p.x,Math.abs(Math.sin(p.wt*9))*.07*p.mv,p.z);PL.root.rotation.y=p.aim;ring.position.x=p.x;ring.position.z=p.z;ring.scale.setScalar(1+Math.sin(T*4)*.05);
const w=Math.sin(p.wt*9)*.8*p.mv;PL.lL.rotation.x=w;PL.lR.rotation.x=-w;PL.body.rotation.x=.1*p.mv+Math.sin(T*2)*.01;PL.body.rotation.y=Math.sin(p.wt*9)*.08*p.mv;
PL.aR.rotation.x=-1.5-p.rec*.15;PL.aL.rotation.x=-1.3;PL.aL.rotation.z=.4;PL.head.rotation.x=-.05;
for(const z of S.z)zAnim(z,play?dt:0);
for(const z of S.d){if(play)z.dt+=dt;const k=Math.min(1,z.dt/.45);z.o.root.rotation.x=-1.5*k;z.o.root.position.y=-Math.max(0,z.dt-.8)*.7+(1-k)*.2;z.o.root.position.x=z.x-Math.sin(z.yaw)*k*.5;z.o.root.position.z=z.z-Math.cos(z.yaw)*k*.5}
S.d=S.d.filter(z=>{if(z.dt<1.8)return true;gone(z);return false});
for(const k of S.pk){k.m.rotation.y=T*2;k.m.position.y=.8+Math.sin(T*3)*.15}
flash.intensity=Math.max(0,flash.intensity-dt*40);
for(const f of fires){const s=Math.sin(T*16+f.s)*.12+Math.sin(T*9+f.s)*.1;f.f1.scale.set(1+s,1+s*1.5,1+s);f.f2.scale.set(1-s,1+s*2,1-s);f.l.intensity=1.6+s*2}
const on=(T*3|0)%2;pr.intensity=on?2.2:0;pb.intensity=on?0:2.2;pc.userData.r.visible=!!on;pc.userData.b.visible=!on;
shake=Math.max(0,shake-dt);const sx=(Math.random()-.5)*shake,sz=(Math.random()-.5)*shake;
cam.position.set(p.x*.5+sx,16,p.z+11+sz);cam.lookAt(p.x*.5,0,p.z-3);dl.position.set(p.x-6,14,p.z+4);dl.target.position.set(p.x,0,p.z);
R.render(sc,cam);renderMinimap();
$('hp').textContent='❤ '+Math.max(0,Math.ceil(p.hp));$('am').textContent='🔫 '+(p.rl>0?'...':p.ammo);$('sc').textContent='SCORE: '+S.score;$('wv').textContent='WAVE: '+S.wave;
$('hit').style.opacity=Math.max(0,p.hit*3);const b=$('ban');b.textContent='WAVE '+S.wave;b.style.opacity=S.ban>0&&play?Math.min(1,S.ban):0}
let last=performance.now();
function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;T+=dt;if(st=='play')upd(dt);render(dt);requestAnimationFrame(loop)}
function show(t,s,b){$('ot').textContent=t;$('os').innerHTML=s;$('ob').textContent=b;$('ov').style.display='flex'}
$('ob').onclick=()=>{if(st=='pause')st='play';else{reset();st='play'}$('ov').style.display='none';snd(440,.1,'sine',.05)};
function pause(){if(st=='play'){st='pause';show('PAUSED','','RESUME')}}
$('pb').onclick=pause;
const joy=$('joy'),knob=$('knob');let jid=null;
function jm(e){const r=joy.getBoundingClientRect(),Rr=r.width/2;let dx=e.clientX-r.left-Rr,dy=e.clientY-r.top-Rr;const d=Math.hypot(dx,dy);if(d>Rr){dx*=Rr/d;dy*=Rr/d}jx=dx/Rr;jy=dy/Rr;knob.style.transform=`translate(${dx}px,${dy}px)`}
joy.onpointerdown=e=>{jid=e.pointerId;joy.setPointerCapture(jid);jm(e)};
joy.onpointermove=e=>{if(e.pointerId==jid)jm(e)};
joy.onpointerup=joy.onpointercancel=e=>{if(e.pointerId==jid){jid=null;jx=jy=0;knob.style.transform=''}};
const fb=$('fire');fb.onpointerdown=e=>{fire=true;fb.setPointerCapture(e.pointerId)};fb.onpointerup=fb.onpointercancel=()=>{fire=false};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(k=='p'||k=='escape')pause();if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault()});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});

requestAnimationFrame(loop);
